name: Build Survival Village V0.3 APK

on:
  push:
    branches:
      - chatgpt-survival-v03-build
  workflow_dispatch:

env:
  GODOT_VERSION: 4.5.1
  PROJECT_PATH: survival-v03-ci
  EXPORT_NAME: SurvivalVillageV03

jobs:
  android-debug:
    name: Android APK V0.3
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.5.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble V0.3 source
        run: |
          cd "$PROJECT_PATH"
          cat part00.gd part01.gd part02.gd part03.gd part04.gd part05.gd > main.gd
          wc -l main.gd

      - name: Setup Godot export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          godot --version

      - name: Validate V0.3 scripts
        shell: bash
        run: |
          cd "$PROJECT_PATH"
          set -o pipefail
          godot --headless --editor --quit 2>&1 | tee /tmp/v03-validate.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/v03-validate.log; then
            echo "Godot script validation failed"
            exit 1
          fi

      - name: Build Android APK
        run: |
          mkdir -v -p build/android
          EXPORT_DIR="$(readlink -f build/android)"
          cd "$PROJECT_PATH"
          godot --headless --verbose --export-debug "Android" "$EXPORT_DIR/${EXPORT_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurvivalVillageV03-APK
          path: build/android/SurvivalVillageV03.apk
          if-no-files-found: error
